{% extends "base.html" %}

{% block title %}NFL Wins Pool - Admin Panel{% endblock %}

{% block content %}


<div class="container admin-container">
    <div class="card-glass" style="height: auto;">
        <h2 style="border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Admin Control Panel</h2>
        <p>Generate a new season and random draft order.</p>

        <div class="admin-form">
            <input type="number" id="season-input" class="admin-input" placeholder="Enter Season Year (e.g. 2024)"
                min="2000" max="2100">
            <input type="password" id="admin-code-input" class="admin-input" placeholder="Admin Code">

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button id="generate-btn" class="btn-primary" style="flex: 1;">Generate Season</button>
                <button id="reset-draft-btn" class="btn-primary"
                    style="flex: 1; background: var(--accent-red); border-color: var(--accent-red);">Reset Draft
                    Results</button>
            </div>

            <button id="scrape-predictions-btn" class="btn-primary"
                style="margin-top: 1rem; width: 100%; background: #333; border-color: #555;">Run Preseason Predictor
                Agent</button>
        </div>

        <p id="admin-message" style="margin-top: 1rem;"></p>
    </div>
</div>

<script src="/static/admin.js?v=4"></script>
{% endblock %}
