{% extends "base.html" %}
{% from "_macros.html" import year_picker %}

{% block title %}Week by Week — {{ year }}{% endblock %}

{% block content %}

<main class="dashboard-main">
    <div class="card-glass page-card weekbyweek-wrap">
        <header class="wp-top">
            <div>
                <div class="eyebrow">NFL Wins Pool</div>
                <h1 class="wp-h1">Weekly Progress<span class="wp-year">/{{ year }}</span></h1>
            </div>
            <div class="wp-top-right">
                {{ year_picker(available_years, year, "/wins-pool/", "/weekbyweek") }}
            </div>
        </header>
        <div class="table-container">
            {{ table|safe }}
        </div>
    </div>
</main>
{% endblock %}
