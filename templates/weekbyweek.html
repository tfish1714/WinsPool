{% extends "base.html" %}

{% block title %}Week by Week — {{ year }}{% endblock %}

{% block content %}

<main class="dashboard-main">
    <div class="card-glass page-card weekbyweek-wrap">
        <header class="wp-top">
            <div>
                <div class="eyebrow">NFL Wins Pool</div>
                <h1 class="wp-h1">Weekly Progress<span class="wp-year">/{{ year }}</span></h1>
            </div>
            <div class="wp-top-right">
                <select id="year-pick" class="season-select" onchange="window.location='/wins-pool/' + this.value + '/weekbyweek'" aria-label="Season">
                    {% for y in available_years %}
                    <option value="{{ y }}" {% if y==year %}selected{% endif %}>{{ y }} Season</option>
                    {% endfor %}
                </select>
            </div>
        </header>
        <div class="table-container">
            {{ table|safe }}
        </div>
    </div>
</main>
{% endblock %}
