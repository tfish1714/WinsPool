{% extends "base.html" %}

{% block title %}NFL Wins Pool Draft{% endblock %}

{% block content %}
<div class="container">
    <!-- Dashboard Header -->
    <h1 style="text-align:center;">NFL Wins Pool Draft <span id="season-display"></span></h1>
    <div style="text-align:center; margin-bottom: 20px;">
        <div id="status-banner" class="status-banner">
            <span class="pulse-dot"></span>
            <p id="current-pick-status">Waiting for draft info...</p>
        </div>
    </div>

    <!-- Tab 1: Draft Board -->
    <main class="dashboard" id="dashboard-main" style="display: none;">
        <section class="draft-board-section card-glass">
            <h2>Draft Board</h2>
            <div class="board-container">
                <ul id="draft-list" class="draft-list">
                    <!-- Instantiated by JS -->
                </ul>
            </div>
        </section>

        <section class="available-teams-section card-glass">
            <h2>Available Teams</h2>
            <div class="teams-grid" id="teams-grid">
                <!-- Instantiated by JS -->
            </div>

            <div class="draft-actions">
                <div id="selection-preview" class="selection-preview hidden">
                    <p>Selected Team: <span id="selected-team-name">None</span></p>
                    <button id="confirm-pick-btn" class="btn-primary" disabled>Confirm Pick</button>
                </div>
            </div>
        </section>
    </main>
</div>
{% endblock %}
