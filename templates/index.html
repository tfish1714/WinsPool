{% extends "base.html" %}

{% block title %}NFL Wins Pool Draft{% endblock %}

{% block content %}
<div class="container">
    <!-- Dashboard Header -->
    <h2 style="text-align:center;">Live Draft Room <span id="season-display"></span></h2>
    <div id="admin-year-selector" class="hidden" style="text-align:center; margin-bottom: 15px;">
        <span style="font-size: 0.9rem; color: var(--text-secondary);">Admin Season Management:</span>
        <select id="season-dropdown"
            style="padding: 0.2rem 0.6rem; border-radius: 6px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid var(--glass-border); font-family: inherit; font-size: 0.9rem; cursor: pointer;">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
        </select>
    </div>
    <div style="text-align:center; margin-bottom: 20px;">
        <div id="status-banner" class="status-banner">
            <span class="pulse-dot"></span>
            <p id="current-pick-status">Waiting for draft info...</p>
        </div>
    </div>

    <!-- Tab 1: Draft Board -->
    <main class="dashboard" id="dashboard-main" style="display: none;">

        <section class="available-teams-section card-glass">
            <h2>Available Teams</h2>
            <div class="teams-grid" id="teams-grid">
                <!-- Instantiated by JS -->
            </div>

            <div class="draft-actions">
                <div id="selection-preview" class="selection-preview hidden">
                    <p>Selected Team: <span id="selected-team-name">None</span></p>
                    <button id="confirm-pick-btn" class="btn-primary" disabled>Confirm Pick</button>
                </div>
            </div>
        </section>

        <section class="draft-board-section card-glass">
            <h2>Draft Board</h2>
            <div class="board-container">
                <ul class="draft-list" id="draft-list">
                    <!-- Instantiated by JS -->
                </ul>
            </div>
        </section>

        <!-- Admin Master Override Dashboard -->
        <div id="admin-master-override" class="card-glass admin-panel-floating hidden"
            style="margin-top: 2rem; border-color: var(--accent-red); display: none; grid-column: 1 / -1;">
            <h3 style="color: var(--accent-red); margin-bottom: 10px; margin-top: 0;">🛡️ Admin Master Override</h3>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <button id="undo-pick-btn" class="btn-primary"
                    style="background: var(--accent-red); border-color: var(--accent-red); padding: 0.5rem 1rem;">Undo
                    Last Pick</button>
                <div style="width: 2px; height: 30px; background: var(--glass-border); margin: 0 10px;"></div>
                <select id="force-team-select" class="admin-input" style="flex: 1; max-width: 200px; margin-bottom: 0;">
                    <option value="">Force Pick...</option>
                </select>
                <button id="force-pick-btn" class="btn-primary"
                    style="background: var(--accent-orange); border-color: var(--accent-orange); padding: 0.5rem 1rem;">Force
                    Pick</button>
            </div>
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
