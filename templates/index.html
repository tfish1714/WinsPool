{% extends "base.html" %}

{% block title %}NFL Wins Pool Draft{% endblock %}

{% block content %}
<div class="container">
    <!-- Page Header -->
    <header class="wp-top">
        <div>
            <div class="eyebrow">Live Draft · <span id="season-display"></span></div>
            <h1 class="wp-h1">Draft Room</h1>
        </div>
        <div class="wp-top-right">
            <div id="admin-year-selector" class="hidden">
                <select id="season-dropdown" class="season-select">
                    <!-- Populated dynamically -->
                </select>
            </div>
            <span id="status-banner" class="mono-pill">
                <span id="current-pick-status">Connecting…</span>
            </span>
        </div>
    </header>

    <!-- Tab 1: Draft Board -->
    <main class="dashboard" id="dashboard-main" style="display: none;">

        <section class="available-teams-section card-glass">
            <h2>Available Teams</h2>
            <div class="draft-actions">
                <div id="selection-preview" class="selection-preview hidden">
                    <p>Selected Team: <span id="selected-team-name">None</span></p>
                    <button id="confirm-pick-btn" class="btn-primary" disabled>Confirm Pick</button>
                </div>
            </div>
            <div class="teams-grid" id="teams-grid">
                <!-- Instantiated by JS -->
            </div>
        </section>

        <section class="draft-board-section card-glass">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin: 0;">Draft Board</h2>
                <div class="admin-controls" style="display: flex; gap: 0.5rem;">
                    <button id="undo-pick-btn" class="btn-primary"
                        style="background: var(--accent-gold); border-color: var(--accent-gold); padding: 0.3rem 0.8rem; font-size: 0.8rem; display: none;">
                        Undo Pick
                    </button>
                    <button id="reset-pick-btn" class="btn-primary"
                        style="background: var(--accent-red); border-color: var(--accent-red); padding: 0.3rem 0.8rem; font-size: 0.8rem; display: none;">
                        Reset Pick
                    </button>
                </div>
            </div>
            <div class="board-container">
                <ul class="draft-list" id="draft-list">
                    <!-- Instantiated by JS -->
                </ul>
            </div>
        </section>

        <!-- Admin Only: Running Portfolio -->
        <section id="admin-portfolio-section" class="card-glass" style="display: none; margin-top: 1rem;">
            <h2>Running Portfolio (Admin Only)</h2>
            <div class="portfolio-container" id="admin-portfolio-content" style="overflow-x: auto;">
                <!-- Instantiated by JS -->
            </div>
        </section>

    </main>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
