{% extends "base.html" %}
{% block title %}{{ payload.name }} - Team - WinsPool{% endblock %}
{% block content %}

{# Inline payload for team_page.js #}
<script id="teamData" type="application/json">{{ payload | tojson }}</script>

<main class="dashboard-main" style="display:block;" id="team-page" data-team="{{ payload.team }}">
  <div class="card-glass page-card team-page" style="height:auto; overflow:visible;">

    <header class="wp-top team-page__top">
      <div class="team-page__ident">
        <img class="team-page__logo" src="{{ payload.logo }}" alt="" width="56" height="56">
        <div>
          <div class="eyebrow">Team</div>
          <h1 class="wp-h1" id="team-name">{{ payload.name }}</h1>
          <div class="team-page__summary" id="team-summary"></div>
        </div>
      </div>
      <select id="team-select" class="season-select" aria-label="Jump to team">
        {% for t in payload.teams %}
        <option value="{{ t.abbr }}"{% if t.abbr == payload.team %} selected{% endif %}>{{ t.name }}</option>
        {% endfor %}
      </select>
    </header>

    <div class="team-page__cols">
      <section class="team-page__section">
        <h2 class="team-page__h2">This Season</h2>
        <div id="team-projected-record" class="team-page__note"></div>
        <div id="team-schedule" class="team-page__schedule"></div>
      </section>

      <section class="team-page__section">
        <h2 class="team-page__h2">History</h2>
        <div id="team-history" class="team-page__history"></div>
      </section>
    </div>

  </div>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ static_url('js/team_page.js') }}"></script>
{% endblock %}
