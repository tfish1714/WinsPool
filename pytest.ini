[pytest]
# Restrict default collection to tests/ (the routes/services unit suite, which
# only needs requirements.txt). tests_e2e/ is deliberately NOT collected by a
# bare `pytest`: tests_e2e/conftest.py imports playwright at module scope, and
# playwright lives only in requirements-dev.txt — not in requirements.txt (what
# the Dockerfile and most environments install). Without this, a bare `pytest`
# from the repo root hard-errors at collection in any requirements.txt-only
# environment and takes tests/ down with it.
#
# Run the e2e suite by explicit path instead:
#   pytest tests_e2e/ -v
# (requires `pip install -r requirements-dev.txt` plus a one-time
# `playwright install chromium`, and the E2E_TEST_PLAYER_IDS /
# E2E_TEST_PLAYER_PASSWORD env vars from scripts/seed_e2e_test_players.py)
testpaths = tests
